[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent-riskops"
version = "1.0.0"
description = "Evidence-grounded synthetic expense review with durable human decisions"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.0,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[project.scripts]
finagent = "finagent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
finagent = ["web/*.html", "web/*.js", "web/*.css", "corpus/*.json", "corpus/*.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
